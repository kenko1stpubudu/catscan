<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity — Shelf Status</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef7fc; color: #12212b; }

.topbar { background: #3ec8f4; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.topbar .brand { display: flex; align-items: center; gap: 14px; }
.topbar .logo { height: 58px; width: auto; border-radius: 8px; display: block; box-shadow: 0 2px 8px rgba(10,40,60,.25); }
.topbar .sub { color: #0a3a52; font-size: 13px; font-weight: 700; letter-spacing: .3px; }
.topbar span.upd { color: #0b3f59; font-size: 13px; font-weight: 600; }
.refresh-btn { background: #0a2838; color: #eaf6fd; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; white-space: nowrap; }
.refresh-btn:hover { background: #06303f; }

.container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

.summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
.sum-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.sum-card .num { font-size: 30px; font-weight: 700; color: #1a1a1a; }
.sum-card .lbl { font-size: 12px; color: #889; margin-top: 4px; }
.sum-card.warn .num { color: #e53935; }
.sum-card.ok .num { color: #43a047; }
.sum-card.low .num { color: #f57f17; }

.filters { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
.filter-sel { padding: 9px 14px; border: 1px solid #dde; border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; outline: none; }
.filter-sel:focus { border-color: #1193d4; }
.date-lbl { font-size: 13px; color: #889; }

/* Attention panel */
.attn { background: #fff; border-radius: 14px; padding: 16px 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 22px; border-left: 4px solid #e53935; }
.attn h2 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.attn .hint { font-size: 12px; color: #889; margin-bottom: 12px; }
.attn-item { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid #f0f2f4; font-size: 13px; }
.attn-item:last-child { border-bottom: none; }
.attn-item .ai-name { font-weight: 600; flex: 1; }
.attn-item .ai-stores { font-size: 12px; color: #889; margin-left: 10px; text-align: right; }
.attn-item .ai-count { background: #ffebee; color: #c62828; font-weight: 700; font-size: 12px; padding: 3px 10px; border-radius: 12px; margin-left: 10px; white-space: nowrap; }
.attn-item .ai-count.low { background: #fff8e1; color: #f57f17; }
.attn-empty { font-size: 13px; color: #43a047; padding: 6px 0; }

/* Store table */
.store-table { background: #fff; border-radius: 14px; padding: 8px 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 22px; }
.store-table h2 { font-size: 14px; font-weight: 700; padding: 10px 14px 6px; }
.st-row { padding: 11px 14px; border-top: 1px solid #f0f2f4; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
.st-name { font-size: 14px; font-weight: 600; }
.st-info { display: flex; gap: 14px; align-items: center; font-size: 12px; color: #889; flex-wrap: wrap; }
.st-miss { color: #e53935; font-weight: 700; }
.st-ok { color: #43a047; font-weight: 700; }

.section-title { font-size: 14px; font-weight: 700; color: #456; margin: 0 0 12px; }
.visits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.visit-card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); border-left: 4px solid #eee; cursor: pointer; }
.visit-card.has-missing { border-left-color: #e53935; }
.visit-card.all-ok { border-left-color: #43a047; }
.visit-card.has-low { border-left-color: #f57f17; }
.vc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.vc-store { font-size: 16px; font-weight: 700; }
.vc-meta { font-size: 12px; color: #889; margin-top: 2px; }
.vc-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }
.badge-miss { background: #ffebee; color: #e53935; }
.badge-ok { background: #e8f5e9; color: #43a047; }
.badge-low { background: #fff8e1; color: #f57f17; }
.vc-sec { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #f7f9fb; border-radius: 8px; margin-bottom: 6px; }
.vc-sec-name { font-size: 13px; font-weight: 500; }
.sec-ok { color: #43a047; font-weight: 600; }
.sec-low { color: #f57f17; font-weight: 600; }
.sec-miss { color: #e53935; font-weight: 600; }
.missing-list { margin-top: 8px; padding: 10px; background: #fff5f5; border-radius: 8px; }
.missing-list .ml-title { font-size: 11px; color: #e53935; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.missing-list .ml-item { font-size: 12px; color: #555; padding: 2px 0; display: flex; gap: 6px; }
.missing-list .ml-item::before { content: "•"; color: #e53935; }
.low-list { margin-top: 8px; padding: 10px; background: #fff8e1; border-radius: 8px; }
.low-list .ml-title { font-size: 11px; color: #f57f17; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.low-list .ml-item { font-size: 12px; color: #555; padding: 2px 0; display: flex; gap: 6px; }
.low-list .ml-item::before { content: "•"; color: #f57f17; }
.exp-list { margin-top: 8px; padding: 10px; background: #fff3e0; border-radius: 8px; }
.exp-list .ml-title { font-size: 11px; color: #ef6c00; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.exp-list .ml-item { font-size: 12px; color: #555; padding: 2px 0; }
.exp-list .ml-item .exp-dt { color: #ef6c00; font-weight: 600; }

.loading { text-align: center; padding: 60px; color: #889; }
.spinner { width: 40px; height: 40px; border: 3px solid #d6ebf7; border-top-color: #1193d4; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 60px; color: #aab; font-size: 15px; }
.empty .icon { font-size: 48px; margin-bottom: 12px; }
.empty-wm { width: min(520px, 84%); opacity: 0.15; display: block; margin: 0 auto 24px; border-radius: 16px; }
.empty .wm-text { font-size: 15px; color: #9fb3c0; }
.err { background: #ffebee; border: 1px solid #ffcdd2; color: #c62828; padding: 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: none; }
.last-updated { font-size: 12px; color: #abb; text-align: right; margin-bottom: 16px; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.modal-header { padding: 20px 24px 16px; border-bottom: 1px solid #f0f2f4; display: flex; justify-content: space-between; align-items: flex-start; position: sticky; top: 0; background: #fff; z-index: 1; }
.modal-header h2 { font-size: 18px; font-weight: 700; }
.modal-header .meta { font-size: 12px; color: #889; margin-top: 3px; }
.modal-close { background: #f4f7f9; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; flex-shrink: 0; }
.modal-body { padding: 20px 24px 24px; }
.avail-section { margin-bottom: 20px; }
.avail-section h3 { font-size: 13px; font-weight: 700; color: #889; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #f0f2f4; }
.avail-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; margin-bottom: 4px; }
.avail-row:nth-child(even) { background: #fafbfc; }
.avail-name { font-size: 13px; color: #333; flex: 1; }
.avail-status { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; white-space: nowrap; }
.status-ok { background: #e8f5e9; color: #2e7d32; }
.status-miss { background: #ffebee; color: #c62828; }
.status-low { background: #fff8e1; color: #f57f17; }
.avail-qty { font-size: 11px; color: #43a047; font-weight: 600; margin-right: 8px; white-space: nowrap; }
.modal-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.ms-box { background: #f7f9fb; border-radius: 10px; padding: 12px; text-align: center; }
.ms-box .n { font-size: 22px; font-weight: 700; }
.ms-box .l { font-size: 11px; color: #889; margin-top: 2px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img class="logo" id="brand-logo" alt="Gravity by GennSpice">
    <span class="sub">Shelf Status Dashboard</span>
  </div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span class="upd" id="date-lbl"></span>
    <button class="refresh-btn" onclick="loadVisits()">↻ Refresh</button>
  </div>
</div>

<div class="container">
  <div class="err" id="err"></div>

  <div class="summary-row">
    <div class="sum-card"><div class="num" id="s-visits">0</div><div class="lbl">Outlets Checked (today)</div></div>
    <div class="sum-card warn"><div class="num" id="s-missing">0</div><div class="lbl">Outlets w/ Missing</div></div>
    <div class="sum-card ok"><div class="num" id="s-fullstock">0</div><div class="lbl">Full Stock Outlets</div></div>
    <div class="sum-card warn"><div class="num" id="s-items">0</div><div class="lbl">Missing Items</div></div>
    <div class="sum-card low"><div class="num" id="s-low">0</div><div class="lbl">Low Items</div></div>
  </div>

  <div class="attn" id="attn" style="display:none;">
    <h2>📊 Items needing attention</h2>
    <div class="hint">Based on the latest check at each outlet — where your items are currently missing or low.</div>
    <div id="attn-body"></div>
  </div>

  <div class="store-table" id="store-table" style="display:none;">
    <h2>🏪 Latest status by outlet</h2>
    <div id="store-table-body"></div>
  </div>

  <div class="filters">
    <select class="filter-sel" id="filter-store" onchange="renderVisits()"><option value="">All Outlets</option></select>
    <select class="filter-sel" id="filter-status" onchange="renderVisits()">
      <option value="">All Status</option>
      <option value="missing">Missing only</option>
      <option value="low">Low only</option>
      <option value="ok">Full stock only</option>
    </select>
    <span class="date-lbl" id="count-lbl"></span>
  </div>

  <div class="last-updated" id="last-updated"></div>

  <div class="loading" id="loading"><div class="spinner"></div><p>Loading shelf data…</p></div>
  <div class="visits-grid" id="visits-grid"></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modal-store"></h2>
        <div class="meta" id="modal-meta"></div>
      </div>
      <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

let allVisits = [];

// Gravity data පමණක් කියවනවා — Kenko items/photos/notes කිසිවක් මෙතනට එන්නේ නැහැ
function gravSec(v) {
  const g = (v.visitData || {}).gravity;
  if (!g) return null;
  return { ok: g.ok || [], low: g.low || [], missing: g.missing || [], expiry: g.expiry || [] };
}
// "available" = ok වලින් (LOW STOCK) tag නැති ඒවා
function availItems(sec) { return (sec.ok || []).filter(p => !/\(LOW STOCK\)$/.test(p.name)); }
function cntMissing(v) { const s = gravSec(v); return s ? s.missing.length : 0; }
function cntLow(v) { const s = gravSec(v); return s ? s.low.length : 0; }

function fmtD(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

async function loadVisits() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('visits-grid').innerHTML = '';
  document.getElementById('err').style.display = 'none';
  try {
    const resp = await fetch(`${WORKER_URL}/get-visits`);
    if (!resp.ok) throw new Error('Server error ' + resp.status);
    const raw = await resp.json();
    if (!Array.isArray(raw)) throw new Error('Invalid response');
    // visits පමණක් + gravity data තියෙන ඒවා පමණක්
    allVisits = raw.filter(v => v.type !== 'order' && gravSec(v));
    populateStoreFilter();
    renderSummary();
    renderAttention();
    renderStoreTable();
    renderVisits();
    document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
    document.getElementById('date-lbl').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  } catch (e) {
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = '⚠ Error: ' + e.message;
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

function populateStoreFilter() {
  const sel = document.getElementById('filter-store');
  const stores = [...new Set(allVisits.map(v => v.store))].sort();
  sel.innerHTML = '<option value="">All Outlets</option>';
  stores.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
}

function renderSummary() {
  const today = new Date().toDateString();
  const todayVisits = allVisits.filter(v => new Date(v.savedAt).toDateString() === today);
  const scope = todayVisits.length ? todayVisits : allVisits;
  const withMissing = scope.filter(v => cntMissing(v) > 0);
  const fullStock = scope.filter(v => cntMissing(v) === 0 && cntLow(v) === 0);
  const totalMissingItems = scope.reduce((s, v) => s + cntMissing(v), 0);
  const totalLowItems = scope.reduce((s, v) => s + cntLow(v), 0);
  document.getElementById('s-visits').textContent = scope.length;
  document.getElementById('s-missing').textContent = withMissing.length;
  document.getElementById('s-fullstock').textContent = fullStock.length;
  document.getElementById('s-items').textContent = totalMissingItems;
  document.getElementById('s-low').textContent = totalLowItems;
}

// latest visit per store
function latestPerStore() {
  const map = {};
  allVisits.forEach(v => {
    if (!map[v.store] || new Date(v.savedAt) > new Date(map[v.store].savedAt)) map[v.store] = v;
  });
  return map;
}

function renderAttention() {
  const panel = document.getElementById('attn');
  const body = document.getElementById('attn-body');
  const latest = latestPerStore();
  // item name -> { missing:[stores], low:[stores] }
  const agg = {};
  Object.values(latest).forEach(v => {
    const sec = gravSec(v);
    (sec.missing || []).forEach(p => {
      agg[p.name] = agg[p.name] || { missing: [], low: [] };
      agg[p.name].missing.push(v.store);
    });
    (sec.low || []).forEach(p => {
      agg[p.name] = agg[p.name] || { missing: [], low: [] };
      agg[p.name].low.push(v.store);
    });
  });
  const rows = Object.entries(agg)
    .map(([name, d]) => ({ name, miss: d.missing, low: d.low, total: d.missing.length + d.low.length }))
    .sort((a, b) => b.miss.length - a.miss.length || b.total - a.total);

  if (!Object.keys(latest).length) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  if (!rows.length) {
    body.innerHTML = `<div class="attn-empty">✅ All your items are in stock at every outlet checked.</div>`;
    return;
  }
  body.innerHTML = rows.map(r => {
    const missBadge = r.miss.length ? `<span class="ai-count">${r.miss.length} missing</span>` : '';
    const lowBadge = r.low.length ? `<span class="ai-count low">${r.low.length} low</span>` : '';
    const stores = [...r.miss.map(s => s), ...r.low.map(s => s + ' (low)')].join(', ');
    return `<div class="attn-item">
      <span class="ai-name">${r.name}</span>
      <span class="ai-stores">${stores}</span>
      ${missBadge}${lowBadge}
    </div>`;
  }).join('');
}

function renderStoreTable() {
  const table = document.getElementById('store-table');
  const body = document.getElementById('store-table-body');
  if (!allVisits.length) { table.style.display = 'none'; return; }
  const map = latestPerStore();
  table.style.display = 'block';
  body.innerHTML = Object.entries(map).sort((a, b) => a[0].localeCompare(b[0])).map(([store, v]) => {
    const miss = cntMissing(v), low = cntLow(v);
    const time = new Date(v.savedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    const date = new Date(v.savedAt).toLocaleDateString('en-GB');
    const statusHTML = miss > 0
      ? `<span class="st-miss">🔴 ${miss} missing</span>`
      : (low > 0 ? `<span style="color:#f57f17;font-weight:700;">🟡 ${low} low</span>` : `<span class="st-ok">✅ Full stock</span>`);
    return `<div class="st-row">
      <div class="st-name">🏪 ${store}</div>
      <div class="st-info">
        <span>🕐 ${date} ${time}</span>
        ${low > 0 && miss > 0 ? `<span style="color:#f57f17;font-weight:700;">🟡 ${low} low</span>` : ''}
        ${statusHTML}
      </div>
    </div>`;
  }).join('');
}

function renderVisits() {
  const grid = document.getElementById('visits-grid');
  const storeFilter = document.getElementById('filter-store').value;
  const statusFilter = document.getElementById('filter-status').value;
  let filtered = allVisits.slice().sort((a, b) => new Date(b.savedAt) - new Date(a.savedAt));
  if (storeFilter) filtered = filtered.filter(v => v.store === storeFilter);
  if (statusFilter === 'missing') filtered = filtered.filter(v => cntMissing(v) > 0);
  if (statusFilter === 'low') filtered = filtered.filter(v => cntLow(v) > 0);
  if (statusFilter === 'ok') filtered = filtered.filter(v => cntMissing(v) === 0 && cntLow(v) === 0);

  document.getElementById('count-lbl').textContent = filtered.length + ' visit' + (filtered.length === 1 ? '' : 's');

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><img class="empty-wm" src="${LOGO}" alt=""><div class="wm-text">No Gravity shelf data yet</div></div>`;
    return;
  }
  window._filteredVisits = filtered;

  grid.innerHTML = filtered.map((v, idx) => {
    const sec = gravSec(v);
    const avail = availItems(sec), low = sec.low || [], miss = sec.missing || [], exp = sec.expiry || [];
    const time = new Date(v.savedAt).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

    const summaryHTML = `<div class="vc-sec">
      <span class="vc-sec-name">Shelf status</span>
      <span>
        <span class="sec-ok">✅ ${avail.length}</span> &nbsp;
        <span class="sec-low">🟡 ${low.length}</span> &nbsp;
        <span class="sec-miss">🔴 ${miss.length}</span>
      </span>
    </div>`;
    const missingHTML = miss.length ? `<div class="missing-list"><div class="ml-title">🔴 Missing (${miss.length})</div>${miss.map(p => `<div class="ml-item">${p.name}</div>`).join('')}</div>` : '';
    const lowHTML = low.length ? `<div class="low-list"><div class="ml-title">🟡 Low Stock (${low.length})</div>${low.map(p => `<div class="ml-item">${p.name}${p.qty ? ' ×' + p.qty : ''}</div>`).join('')}</div>` : '';
    const expHTML = exp.length ? `<div class="exp-list"><div class="ml-title">⏰ Expiry (${exp.length})</div>${exp.map(e => `<div class="ml-item">${e.name} — <span class="exp-dt">${(e.dates || []).map(fmtD).join(', ')}</span></div>`).join('')}</div>` : '';

    const cardCls = miss.length ? 'has-missing' : (low.length ? 'has-low' : 'all-ok');
    const badge = miss.length
      ? `<span class="vc-badge badge-miss">${miss.length} missing</span>`
      : (low.length ? `<span class="vc-badge badge-low">${low.length} low</span>` : `<span class="vc-badge badge-ok">Full Stock</span>`);

    return `<div class="visit-card ${cardCls}" onclick="openModal(window._filteredVisits[${idx}])" title="Click for full item list">
      <div class="vc-header">
        <div>
          <div class="vc-store">🏪 ${v.store}</div>
          <div class="vc-meta">🕐 ${time}</div>
        </div>
        ${badge}
      </div>
      <div>${summaryHTML}${missingHTML}${lowHTML}${expHTML}</div>
    </div>`;
  }).join('');
}

function openModal(v) {
  const sec = gravSec(v);
  const avail = availItems(sec), low = sec.low || [], miss = sec.missing || [], exp = sec.expiry || [];
  document.getElementById('modal-store').textContent = '🏪 ' + v.store;
  const time = new Date(v.savedAt).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  document.getElementById('modal-meta').textContent = '🕐 ' + time;

  let body = `<div class="modal-summary">
    <div class="ms-box"><div class="n" style="color:#43a047;">${avail.length}</div><div class="l">Available</div></div>
    <div class="ms-box"><div class="n" style="color:#f57f17;">${low.length}</div><div class="l">Low</div></div>
    <div class="ms-box"><div class="n" style="color:#e53935;">${miss.length}</div><div class="l">Missing</div></div>
  </div>`;

  if (avail.length) {
    body += `<div class="avail-section"><h3>✅ Available (${avail.length})</h3>` +
      avail.map(p => `<div class="avail-row"><span class="avail-name">${p.name}</span><span>${p.qty ? `<span class="avail-qty">×${p.qty}</span>` : ''}<span class="avail-status status-ok">In stock</span></span></div>`).join('') + `</div>`;
  }
  if (low.length) {
    body += `<div class="avail-section"><h3>🟡 Low Stock (${low.length})</h3>` +
      low.map(p => `<div class="avail-row"><span class="avail-name">${p.name}</span><span>${p.qty ? `<span class="avail-qty">×${p.qty}</span>` : ''}<span class="avail-status status-low">Low</span></span></div>`).join('') + `</div>`;
  }
  if (miss.length) {
    body += `<div class="avail-section"><h3>🔴 Missing (${miss.length})</h3>` +
      miss.map(p => `<div class="avail-row"><span class="avail-name">${p.name}</span><span class="avail-status status-miss">Not on shelf</span></div>`).join('') + `</div>`;
  }
  if (exp.length) {
    body += `<div class="avail-section"><h3>⏰ Expiry Dates (${exp.length})</h3>` +
      exp.map(e => `<div class="avail-row"><span class="avail-name">${e.name}</span><span class="avail-status status-low">${(e.dates || []).map(fmtD).join(', ')}</span></div>`).join('') + `</div>`;
  }
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

document.getElementById('brand-logo').src = LOGO;
loadVisits();
</script>
</body>
</html>
