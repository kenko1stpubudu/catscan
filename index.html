<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenko1st Apps</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.wrap { max-width: 400px; width: 100%; padding: 40px 20px; }
h1 { font-size: 32px; font-weight: 800; color: #c8f04c; margin-bottom: 6px; }
p { font-size: 14px; color: #666; margin-bottom: 32px; }
.btn { display: block; width: 100%; padding: 18px 20px; border-radius: 14px; text-decoration: none; margin-bottom: 12px; transition: all 0.15s; }
.btn:active { transform: scale(0.98); }
.btn-rep { background: #1e1e1e; border: 1px solid #2a2a2a; }
.btn-manager { background: #c8f04c; }
.btn h2 { font-size: 17px; font-weight: 700; }
.btn-rep h2 { color: #f0f0f0; }
.btn-manager h2 { color: #0f0f0f; }
.btn p { font-size: 13px; margin: 0; margin-top: 3px; }
.btn-rep p { color: #666; }
.btn-manager p { color: #3a4a10; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Kenko1st</h1>
  <p>Field Sales & Manager Tools</p>
  <a href="kenko1st_field.html" class="btn btn-rep">
    <h2>📱 Field Sales Tool</h2>
    <p>Rep — Store visit, shelf scan, submit report</p>
  </a>
  <a href="kenko1st_manager.html" class="btn btn-manager">
    <h2>🖥 Manager Dashboard</h2>
    <p>All store visits, missing items, real-time</p>
  </a>
  <a href="kenko1st_checker.html" class="btn btn-rep">
    <h2>🔍 Shelf Checker</h2>
    <p>Quick shelf photo scan & availability check</p>
  </a>
</div>
</body>
</html>
