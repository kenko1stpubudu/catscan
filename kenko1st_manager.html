<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenko1st Manager Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }

.topbar { background: #1a1a1a; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
.topbar h1 { color: #c8f04c; font-size: 20px; font-weight: 700; }
.topbar span { color: #888; font-size: 13px; }
.refresh-btn { background: #c8f04c; color: #1a1a1a; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }

.container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }

/* Summary cards */
.summary-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
.sum-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.sum-card .num { font-size: 32px; font-weight: 700; color: #1a1a1a; }
.sum-card .lbl { font-size: 12px; color: #888; margin-top: 4px; }
.sum-card.warn .num { color: #e53935; }
.sum-card.ok .num { color: #43a047; }

/* Filters */
.filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
.filter-sel { padding: 9px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; outline: none; }
.filter-sel:focus { border-color: #c8f04c; }
.date-lbl { font-size: 13px; color: #888; }

/* Visit cards */
.visits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.visit-card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border-left: 4px solid #eee; }
.visit-card.has-missing { border-left-color: #e53935; }
.visit-card.all-ok { border-left-color: #43a047; }

.vc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.vc-store { font-size: 16px; font-weight: 700; }
.vc-meta { font-size: 12px; color: #888; margin-top: 2px; }
.vc-badge { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; }
.badge-miss { background: #ffebee; color: #e53935; }
.badge-ok { background: #e8f5e9; color: #43a047; }

.vc-sections { margin-top: 10px; }
.vc-sec { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; background: #f9f9f9; border-radius: 8px; margin-bottom: 6px; }
.vc-sec-name { font-size: 13px; font-weight: 500; }
.vc-sec-status { font-size: 12px; }
.sec-ok { color: #43a047; }
.sec-miss { color: #e53935; font-weight: 600; }

.missing-list { margin-top: 8px; padding: 10px; background: #fff5f5; border-radius: 8px; }
.missing-list .ml-title { font-size: 11px; color: #e53935; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.missing-list .ml-item { font-size: 12px; color: #555; padding: 2px 0; display: flex; gap: 6px; }
.missing-list .ml-item::before { content: "•"; color: #e53935; }

.vc-notes { margin-top: 8px; font-size: 12px; color: #888; font-style: italic; padding: 6px 10px; background: #f9f9f9; border-radius: 6px; }

/* Loading */
.loading { text-align: center; padding: 60px; color: #888; }
.spinner { width: 40px; height: 40px; border: 3px solid #eee; border-top-color: #c8f04c; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty { text-align: center; padding: 60px; color: #aaa; font-size: 15px; }
.empty .icon { font-size: 48px; margin-bottom: 12px; }

/* Error */
.err { background: #ffebee; border: 1px solid #ffcdd2; color: #c62828; padding: 14px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: none; }

/* Timestamp */
.last-updated { font-size: 12px; color: #aaa; text-align: right; margin-bottom: 16px; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.modal-header { padding: 20px 24px 16px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: flex-start; position: sticky; top: 0; background: #fff; z-index: 1; }
.modal-header h2 { font-size: 18px; font-weight: 700; }
.modal-header .meta { font-size: 12px; color: #888; margin-top: 3px; }
.modal-close { background: #f5f5f5; border: none; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.modal-body { padding: 20px 24px 24px; }

/* Availability table */
.avail-section { margin-bottom: 20px; }
.avail-section h3 { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #f0f0f0; }
.avail-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; margin-bottom: 4px; }
.avail-row:nth-child(even) { background: #fafafa; }
.avail-name { font-size: 13px; color: #333; flex: 1; }
.avail-code { font-size: 11px; color: #bbb; font-family: monospace; margin-right: 12px; }
.avail-status { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; white-space: nowrap; }
.status-ok { background: #e8f5e9; color: #2e7d32; }
.status-miss { background: #ffebee; color: #c62828; }
.status-verify { background: #fff8e1; color: #f57f17; }
.status-low { background: #fff8e1; color: #f57f17; }
.avail-qty { font-size: 11px; color: #43a047; font-weight: 600; margin-right: 8px; white-space: nowrap; }

/* Low / expiry / competitor blocks on cards */
.low-list { margin-top: 8px; padding: 10px; background: #fff8e1; border-radius: 8px; }
.low-list .ml-title { font-size: 11px; color: #f57f17; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.low-list .ml-item { font-size: 12px; color: #555; padding: 2px 0; display: flex; gap: 6px; }
.low-list .ml-item::before { content: "•"; color: #f57f17; }
.exp-list { margin-top: 8px; padding: 10px; background: #fff3e0; border-radius: 8px; }
.exp-list .ml-title { font-size: 11px; color: #ef6c00; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.exp-list .ml-item { font-size: 12px; color: #555; padding: 2px 0; }
.exp-list .ml-item .exp-dt { color: #ef6c00; font-weight: 600; }
.comp-note { margin-top: 8px; font-size: 12px; color: #6a1b9a; padding: 8px 10px; background: #f3e5f5; border-radius: 8px; }
.badge-low { background: #fff8e1; color: #f57f17; }

/* Modal summary 4 cols */
.modal-summary.four { grid-template-columns: repeat(4, 1fr); }
.photo-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.photo-row img { width: 90px; height: 90px; object-fit: cover; border-radius: 10px; border: 1px solid #eee; cursor: pointer; }
.gps-link { display: inline-block; margin-top: 10px; font-size: 13px; color: #1565c0; text-decoration: none; padding: 8px 12px; background: #e3f2fd; border-radius: 8px; }
.modal-photo-full { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
.modal-photo-full.open { display: flex; }
.modal-photo-full img { max-width: 100%; max-height: 100%; border-radius: 8px; }

/* Summary bar in modal */
.modal-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.ms-card { background: #f9f9f9; border-radius: 10px; padding: 12px; text-align: center; }
.ms-num { font-size: 24px; font-weight: 700; }
.ms-lbl { font-size: 11px; color: #888; margin-top: 2px; }

/* Download btn */
.dl-btn { width: 100%; padding: 12px; background: #1a1a1a; color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 16px; }

/* Store summary table */
.store-table { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 24px; }
.store-table h3 { font-size: 14px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }
.st-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.st-row:last-child { border-bottom: none; }
.st-name { font-size: 14px; font-weight: 500; }
.st-info { font-size: 12px; color: #888; display: flex; gap: 16px; }
.st-miss { color: #e53935; font-weight: 600; }
.st-ok { color: #43a047; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>Kenko1st</h1>
    <span>Manager Dashboard</span>
  </div>
  <button class="refresh-btn" onclick="loadVisits()">🔄 Refresh</button>
</div>

<div class="container">
  <div class="err" id="err"></div>
  <div class="last-updated" id="last-updated"></div>

  <!-- Summary -->
  <div class="summary-row" id="summary-row">
    <div class="sum-card"><div class="num" id="s-visits">-</div><div class="lbl">Total Visits Today</div></div>
    <div class="sum-card warn"><div class="num" id="s-missing">-</div><div class="lbl">Stores with Missing Items</div></div>
    <div class="sum-card ok"><div class="num" id="s-fullstock">-</div><div class="lbl">Full Stock Stores</div></div>
    <div class="sum-card"><div class="num" id="s-items">-</div><div class="lbl">Total Missing Items</div></div>
    <div class="sum-card"><div class="num" id="s-low" style="color:#f57f17;">-</div><div class="lbl">Total Low Stock Items</div></div>
  </div>

  <!-- Store Summary Table -->
  <div class="store-table" id="store-table" style="display:none;">
    <h3>📊 Store Overview</h3>
    <div id="store-table-body"></div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <select class="filter-sel" id="filter-store" onchange="renderVisits()">
      <option value="">All Stores</option>
    </select>
    <select class="filter-sel" id="filter-status" onchange="renderVisits()">
      <option value="">All Status</option>
      <option value="missing">Has Missing Items</option>
      <option value="low">Has Low Stock</option>
      <option value="ok">Full Stock</option>
    </select>
    <span class="date-lbl" id="date-lbl"></span>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div>Loading visits...</div>
  </div>

  <!-- Visits -->
  <div class="visits-grid" id="visits-grid"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <h2 id="modal-store">Store</h2>
        <div class="meta" id="modal-meta"></div>
      </div>
      <button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="modal-photo-full" id="photo-full" onclick="this.classList.remove('open')"><img id="photo-full-img" src=""></div>

<script>
const WORKER_URL = "https://odd-grass-0c29.kenko1st-pubudu.workers.dev";

// ===== DATA HELPERS (new field-tool format) =====
// visitData = { all: { ok:[{code,name,qty?}], low:[...], missing:[...], expiry:[{code,name,dates:[]}], competitor:"", notes:"" } }
function getSec(v) {
  const vd = v.visitData || {};
  // නව format එකේ "all" key එක; පරණ visits වල වෙන keys තියෙන්න පුළුවන් — merge කරනවා
  if (vd.all) return vd.all;
  // legacy: sections කිහිපයක් තිබ්බොත් එකතු කරනවා
  const merged = { ok: [], low: [], missing: [], expiry: [], competitor: '', notes: '' };
  Object.values(vd).forEach(sec => {
    merged.ok.push(...(sec.ok || []));
    merged.low.push(...(sec.low || []));
    merged.missing.push(...(sec.missing || []));
    merged.expiry.push(...(sec.expiry || []));
    if (sec.notes) merged.notes += (merged.notes ? ' · ' : '') + sec.notes;
    if (sec.competitor) merged.competitor += (merged.competitor ? ' · ' : '') + sec.competitor;
  });
  return merged;
}
function cntMissing(v) { return (getSec(v).missing || []).length; }
function cntLow(v) { return (getSec(v).low || []).length; }
function cntOk(v) { const s = getSec(v); return (s.ok || []).length; }
function qtyStr(p) { return p.qty ? ` <span class="avail-qty">×${p.qty}</span>` : ''; }

function showPhoto(src) {
  document.getElementById('photo-full-img').src = src;
  document.getElementById('photo-full').classList.add('open');
}
let allVisits = [];

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

function openModal(v) {
  document.getElementById('modal-store').textContent = '🏪 ' + v.store;
  const time = new Date(v.savedAt).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  document.getElementById('modal-meta').textContent = '👤 ' + v.rep + '  ·  🕐 ' + time;

  const body = document.getElementById('modal-body');
  const sec = getSec(v);
  const ok = sec.ok || [], low = sec.low || [], miss = sec.missing || [], exp = sec.expiry || [];
  const totalItems = ok.length + low.length + miss.length;

  let html = `<div class="modal-summary four">
    <div class="ms-card"><div class="ms-num" style="color:#1a1a1a;">${totalItems}</div><div class="ms-lbl">Total Checked</div></div>
    <div class="ms-card"><div class="ms-num" style="color:#2e7d32;">${ok.length}</div><div class="ms-lbl">✅ ඇත / In</div></div>
    <div class="ms-card"><div class="ms-num" style="color:#f57f17;">${low.length}</div><div class="ms-lbl">🟡 Low Stock</div></div>
    <div class="ms-card"><div class="ms-num" style="color:#c62828;">${miss.length}</div><div class="ms-lbl">🔴 නැත / Out</div></div>
  </div>`;

  // GPS removed on field side, but support old data
  if (v.gps && v.gps.lat) {
    html += `<a class="gps-link" href="https://maps.google.com/?q=${v.gps.lat},${v.gps.lng}" target="_blank">📍 View location on map</a>`;
  }

  // Photos
  if (v.photos && v.photos.length) {
    html += `<div class="photo-row">` + v.photos.map(src =>
      `<img src="${src}" onclick="showPhoto('${src}')">`).join('') + `</div>`;
  }

  function itemRow(p, cls, label) {
    return `<div class="avail-row">
      <span class="avail-name">${p.name}</span>
      ${qtyStr(p)}<span class="avail-code">${p.code}</span>
      <span class="avail-status ${cls}">${label}</span>
    </div>`;
  }

  const rows = [
    ...miss.map(p => itemRow(p, 'status-miss', '🔴 නැත')),
    ...low.map(p => itemRow(p, 'status-low', '🟡 Low')),
    ...ok.map(p => itemRow(p, 'status-ok', '✅ ඇත')),
  ];
  if (rows.length) html += `<div class="avail-section"><h3>Shelf Availability</h3>${rows.join('')}</div>`;

  // Expiry
  if (exp.length) {
    html += `<div class="avail-section"><h3>⏰ Expiry Dates</h3>`;
    exp.forEach(e => {
      const dates = (e.dates || []).map(d => {
        const dt = new Date(d + 'T00:00:00');
        const soon = (dt - new Date()) < 30*864e5;
        return `<span class="${soon ? '' : ''}" style="color:${soon ? '#c62828' : '#ef6c00'};font-weight:600;">${fmtD(d)}</span>`;
      }).join(', ');
      html += `<div class="avail-row"><span class="avail-name">${e.name}</span><span style="font-size:12px;">${dates}</span></div>`;
    });
    html += `</div>`;
  }

  // Competitor
  if (sec.competitor) html += `<div class="comp-note">🏷 <b>Competitors:</b> ${sec.competitor}</div>`;
  // Notes
  if (sec.notes) html += `<div style="font-size:12px;color:#888;font-style:italic;padding:8px 10px;background:#f9f9f9;border-radius:8px;margin-top:10px;">📝 ${sec.notes}</div>`;

  html += `<button class="dl-btn" onclick='downloadReport(${JSON.stringify(v).replace(/</g,"\u003c").replace(/'/g,"&#39;")})'>📥 Text Report Download</button>`;
  body.innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}

function fmtD(dateStr) {
  const [y,m,d] = dateStr.split('-');
  return d + '/' + m + '/' + y;
}

function downloadReport(v) {
  const time = new Date(v.savedAt).toLocaleString('en-GB');
  let text = `KENKO1ST AVAILABILITY REPORT\n`;
  text += `${'='.repeat(40)}\n`;
  text += `Store  : ${v.store}\n`;
  text += `Rep    : ${v.rep}\n`;
  text += `Date   : ${time}\n`;
  text += `${'='.repeat(40)}\n\n`;

  const sec = getSec(v);
  const ok = sec.ok || [], low = sec.low || [], miss = sec.missing || [], exp = sec.expiry || [];

  if (miss.length) {
    text += `🔴 MISSING (${miss.length})\n${'-'.repeat(30)}\n`;
    miss.forEach(p => { text += `  • ${p.name}\n`; });
    text += '\n';
  }
  if (low.length) {
    text += `🟡 LOW STOCK (${low.length})\n${'-'.repeat(30)}\n`;
    low.forEach(p => { text += `  • ${p.name}${p.qty ? ' ×'+p.qty : ''}\n`; });
    text += '\n';
  }
  if (ok.length) {
    text += `✅ AVAILABLE (${ok.length})\n${'-'.repeat(30)}\n`;
    ok.forEach(p => { text += `  • ${p.name}${p.qty ? ' ×'+p.qty : ''}\n`; });
    text += '\n';
  }
  if (exp.length) {
    text += `⏰ EXPIRY DATES\n${'-'.repeat(30)}\n`;
    exp.forEach(e => { text += `  • ${e.name} — ${(e.dates||[]).map(fmtD).join(', ')}\n`; });
    text += '\n';
  }
  if (sec.competitor) text += `🏷 Competitors: ${sec.competitor}\n\n`;
  if (sec.notes) text += `📝 Notes: ${sec.notes}\n\n`;

  text += `${'='.repeat(40)}\n`;
  text += `MISSING: ${miss.length}  ·  LOW: ${low.length}\n`;
  text += `STATUS: ${miss.length === 0 && low.length === 0 ? 'FULL STOCK ✅' : 'ACTION REQUIRED ⚠'}\n`;

  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `kenko1st_${v.store.replace(/\s+/g,'_')}_${new Date(v.savedAt).toISOString().slice(0,10)}.txt`;
  a.click();
}

async function loadVisits() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('visits-grid').innerHTML = '';
  document.getElementById('err').style.display = 'none';

  try {
    const resp = await fetch(`${WORKER_URL}/get-visits`);
    if (!resp.ok) throw new Error('Server error ' + resp.status);
    allVisits = await resp.json();
    if (!Array.isArray(allVisits)) throw new Error('Invalid response');

    populateStoreFilter();
    renderSummary();
    renderStoreTable();
    renderVisits();
    document.getElementById('last-updated').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
    document.getElementById('date-lbl').textContent = new Date().toLocaleDateString('en-GB', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(e) {
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = '⚠ Error: ' + e.message;
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

function populateStoreFilter() {
  const sel = document.getElementById('filter-store');
  const stores = [...new Set(allVisits.map(v => v.store))].sort();
  sel.innerHTML = '<option value="">All Stores</option>';
  stores.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
}

function getTotalMissing(visitData) {
  return cntMissing({ visitData });
}
function getTotalLow(visitData) {
  return cntLow({ visitData });
}

function renderSummary() {
  const today = new Date().toDateString();
  const todayVisits = allVisits.filter(v => new Date(v.savedAt).toDateString() === today);
  const withMissing = todayVisits.filter(v => getTotalMissing(v.visitData) > 0);
  const fullStock = todayVisits.filter(v => getTotalMissing(v.visitData) === 0);
  const totalMissingItems = todayVisits.reduce((sum, v) => sum + getTotalMissing(v.visitData), 0);
  const totalLowItems = todayVisits.reduce((sum, v) => sum + getTotalLow(v.visitData), 0);

  document.getElementById('s-visits').textContent = todayVisits.length || allVisits.length;
  document.getElementById('s-missing').textContent = withMissing.length;
  document.getElementById('s-fullstock').textContent = fullStock.length;
  document.getElementById('s-items').textContent = totalMissingItems;
  document.getElementById('s-low').textContent = totalLowItems;
}

function renderStoreTable() {
  const table = document.getElementById('store-table');
  const body = document.getElementById('store-table-body');
  if (!allVisits.length) { table.style.display = 'none'; return; }

  // Latest visit per store
  const storeMap = {};
  allVisits.forEach(v => {
    if (!storeMap[v.store] || new Date(v.savedAt) > new Date(storeMap[v.store].savedAt)) {
      storeMap[v.store] = v;
    }
  });

  table.style.display = 'block';
  body.innerHTML = Object.entries(storeMap).map(([store, v]) => {
    const miss = getTotalMissing(v.visitData);
    const low = getTotalLow(v.visitData);
    const time = new Date(v.savedAt).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
    const date = new Date(v.savedAt).toLocaleDateString('en-GB');
    const statusHTML = miss > 0
      ? `<span class="st-miss">🔴 ${miss} missing</span>`
      : (low > 0 ? `<span style="color:#f57f17;font-weight:600;">🟡 ${low} low</span>` : `<span class="st-ok">✅ Full stock</span>`);
    return `<div class="st-row">
      <div class="st-name">🏪 ${store}</div>
      <div class="st-info">
        <span>👤 ${v.rep}</span>
        <span>🕐 ${date} ${time}</span>
        ${low > 0 && miss > 0 ? `<span style="color:#f57f17;font-weight:600;">🟡 ${low} low</span>` : ''}
        ${statusHTML}
      </div>
    </div>`;
  }).join('');
}

function renderVisits() {
  const grid = document.getElementById('visits-grid');
  const storeFilter = document.getElementById('filter-store').value;
  const statusFilter = document.getElementById('filter-status').value;

  let filtered = allVisits;
  if (storeFilter) filtered = filtered.filter(v => v.store === storeFilter);
  if (statusFilter === 'missing') filtered = filtered.filter(v => getTotalMissing(v.visitData) > 0);
  if (statusFilter === 'low') filtered = filtered.filter(v => getTotalLow(v.visitData) > 0);
  if (statusFilter === 'ok') filtered = filtered.filter(v => getTotalMissing(v.visitData) === 0 && getTotalLow(v.visitData) === 0);

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;"><div class="icon">📭</div><div>No visits found</div></div>`;
    return;
  }

  // Store filtered visits globally for modal access
  window._filteredVisits = filtered;

  grid.innerHTML = filtered.map((v, idx) => {
    const sec = getSec(v);
    const miss = sec.missing || [], low = sec.low || [], ok = sec.ok || [], exp = sec.expiry || [];
    const totalMiss = miss.length, totalLow = low.length;
    const time = new Date(v.savedAt).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });

    const summaryHTML = `<div class="vc-sec">
      <span class="vc-sec-name">Shelf status</span>
      <span class="vc-sec-status">
        <span class="sec-ok">✅ ${ok.length}</span> &nbsp;
        <span style="color:#f57f17;font-weight:600;">🟡 ${totalLow}</span> &nbsp;
        <span class="sec-miss">🔴 ${totalMiss}</span>
      </span>
    </div>`;

    let missingHTML = '';
    if (totalMiss > 0) {
      missingHTML = `<div class="missing-list">
        <div class="ml-title">🔴 Missing (${totalMiss})</div>
        ${miss.map(p => `<div class="ml-item">${p.name}</div>`).join('')}
      </div>`;
    }
    let lowHTML = '';
    if (totalLow > 0) {
      lowHTML = `<div class="low-list">
        <div class="ml-title">🟡 Low Stock (${totalLow})</div>
        ${low.map(p => `<div class="ml-item">${p.name}${p.qty ? ' ×'+p.qty : ''}</div>`).join('')}
      </div>`;
    }
    let expHTML = '';
    if (exp.length > 0) {
      expHTML = `<div class="exp-list">
        <div class="ml-title">⏰ Expiry (${exp.length})</div>
        ${exp.map(e => `<div class="ml-item">${e.name} — <span class="exp-dt">${(e.dates||[]).map(fmtD).join(', ')}</span></div>`).join('')}
      </div>`;
    }
    const compHTML = sec.competitor ? `<div class="comp-note">🏷 ${sec.competitor}</div>` : '';
    const notesHTML = sec.notes ? `<div class="vc-notes">📝 ${sec.notes}</div>` : '';
    const photoTag = (v.photos && v.photos.length) ? ` 📷${v.photos.length}` : '';

    const cardCls = totalMiss > 0 ? 'has-missing' : 'all-ok';
    const badge = totalMiss > 0
      ? `<span class="vc-badge badge-miss">${totalMiss} missing</span>`
      : (totalLow > 0 ? `<span class="vc-badge badge-low">${totalLow} low</span>` : `<span class="vc-badge badge-ok">Full Stock</span>`);

    return `<div class="visit-card ${cardCls}" onclick="openModal(window._filteredVisits[${idx}])" style="cursor:pointer;" title="Click to view full report">
      <div class="vc-header">
        <div>
          <div class="vc-store">🏪 ${v.store}${photoTag}</div>
          <div class="vc-meta">👤 ${v.rep} &nbsp;·&nbsp; 🕐 ${time}</div>
        </div>
        ${badge}
      </div>
      <div class="vc-sections">${summaryHTML}${missingHTML}${lowHTML}${expHTML}${compHTML}${notesHTML}</div>
    </div>`;
  }).join('');
}

// Auto refresh every 2 minutes
loadVisits();
setInterval(loadVisits, 120000);
</script>
</body>
</html>
